<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Zentrixs: Premium IT Solutions</title>
  <desc>Zentrixs Premium IT Solutions</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#081020"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="tile"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle glow layer -->
  <circle cx="64" cy="64" r="38" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Zentrixs logo mark -->
  <image x="24" y="24" width="80" height="80" clip-path="url(#tile)" filter="url(#glow)" href="data:image/png;base64,"/>
</svg>
