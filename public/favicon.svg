<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Zentrixs: Premium IT Solutions</title>
  <desc>Zentrixs Premium IT Solutions</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#081020"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle glow layer -->
  <circle cx="64" cy="64" r="38" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Zentrix Interlocking Monogram Vector -->
  <g transform="translate(24, 28) scale(1.25)" filter="url(#glow)">
    <!-- Top Monogram stroke -->
    <path d="M4 8 L36 8 L44 18 L24 18 L36 32 L48 32 L40 42 L24 42 L12 28 L32 28 Z" 
          fill="none" />
    <!-- Main Left-Right Interlocking Geometry -->
    <path d="M6 12 L34 12 L44 24 L22 24 L34 38 L48 38 L38 48 L14 48 L4 36 L24 36 Z" 
          fill="url(#cyanGrad)" />
    <path d="M48 24 L56 12 L38 12 L44 20 L28 20 L20 30 L32 30 L22 42 L10 42 L18 52 L42 52 L54 38 L34 38 Z" 
          fill="url(#blueGrad)" opacity="0.9" />
  </g>
</svg>
